name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup templates + Java + Android
        run: |
          set -e
          echo "=== Versão do Godot ==="
          godot --version

          mkdir -p \~/.local/share/godot/export_templates/4.7.1.stable
          mkdir -p \~/.config/godot
          mkdir -p build

          echo "=== Baixando export templates ==="
          wget -q --show-progress https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz -O /tmp/templates.tpz
          
          echo "=== Extraindo templates ==="
          unzip -q /tmp/templates.tpz -d /tmp/templates
          ls -la /tmp/templates/templates/ | head -20
          
          cp /tmp/templates/templates/* \~/.local/share/godot/export_templates/4.7.1.stable/
          
          echo "=== Templates instalados ==="
          ls -la \~/.local/share/godot/export_templates/4.7.1.stable/ | grep -E 'android|version'

          # Garante debug keystore
          if [ ! -f /root/debug.keystore ]; then
            keytool -genkey -v -keystore /root/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Descobre Java
          JAVA_PATH=$(dirname $(dirname $(readlink -f $(which java) || which java)))
          echo "Java path: $JAVA_PATH"

          # Cria o arquivo com o nome CORRETO para Godot 4.7
          cat > \~/.config/godot/editor_settings-4.7.tres << EOF
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/java_sdk_path = "$JAVA_PATH"
export/android/android_sdk_path = "/usr/lib/android-sdk"
export/android/debug_keystore = "/root/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
EOF

          echo "=== Editor Settings criado ==="
          cat \~/.config/godot/editor_settings-4.7.tres

      - name: Import project (pre-heat)
        run: |
          godot --headless --editor --quit-after 3 || true

      - name: Export Debug APK
        run: |
          godot --headless --verbose --export-debug "Android" build/Arcana-Realms-Prototype-01.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arcana-Realms-Prototype-01-APK
          path: build/Arcana-Realms-Prototype-01.apk
          if-no-files-found: error
